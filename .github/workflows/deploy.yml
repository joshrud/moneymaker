name: Deploy to Production

on:
  push:
    branches: [prod]

# Required for GitHub OIDC → AWS IAM token exchange
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Deploy via CodeDeploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package and upload to S3
        run: |
          zip -r deploy-${{ github.sha }}.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".venv/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "models/*" \
            --exclude "logs/*" \
            --exclude "reports/*"

          aws s3 cp deploy-${{ github.sha }}.zip \
            s3://${{ vars.S3_DEPLOY_BUCKET }}/moneymaker/deploy-${{ github.sha }}.zip

      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name moneymaker \
            --deployment-group-name moneymaker-production \
            --s3-location bucket=${{ vars.S3_DEPLOY_BUCKET }},key=moneymaker/deploy-${{ github.sha }}.zip,bundleType=zip \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --description "git ${{ github.sha }}: ${{ github.event.head_commit.message }}" \
            --query "deploymentId" \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment started: $DEPLOYMENT_ID"

      - name: Wait for deployment
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }}

      - name: Show deployment result
        if: always()
        run: |
          aws deploy get-deployment \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }} \
            --query "deploymentInfo.{Status:status,Error:errorInformation}" \
            --output table
